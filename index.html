<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silva Pimenta — Painéis Jurídico (TV)</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#0F2F3B;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.2s ease}
  iframe.on{opacity:1}
  .keepalive{position:fixed;right:0;bottom:0;width:4px;height:4px;opacity:.01;pointer-events:none;z-index:10000}
</style>
</head>
<body>
<video class="keepalive" src="keepalive.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
<iframe id="fa" src="trimestre.html" class="on"></iframe>
<iframe id="fb"></iframe>
<script>
// ROTADOR DA TV (05/08/2026): alterna os 3 painéis no MESMO link que já está na TV.
// trimestre (teal) -> mês (bordô) -> encerramentos, 45s cada, com crossfade.
const PAINEIS = [
  'trimestre.html',
  'mes/index.html',
  'https://silvapimentadireitomedico-cpu.github.io/dashboard-encerramentos-silva-pimenta/'
];
const TEMPO_MS = 45000;
let idx = 0, mostrando = 'fa', tmr = null;
// O relógio conta a partir de quando o painel APARECE (não do início do carregamento).
// Antes era setInterval fixo: o mensal (mais pesado) entrava atrasado e saía no horário,
// ficando com bem menos tempo de tela que os outros (reclamação William 11/08).
function mostrar(el, prox) {
  const antigo = document.getElementById(mostrando);
  antigo.classList.remove('on');
  el.classList.add('on');
  mostrando = prox;
  // esvazia o iframe oculto (economiza e evita som/fala em dobro)
  setTimeout(() => { if (antigo !== document.getElementById(mostrando)) antigo.src = 'about:blank'; }, 1600);
  clearTimeout(tmr);
  tmr = setTimeout(trocar, TEMPO_MS); // próximo giro: 45s de tela CHEIOS pra este painel
}
function trocar() {
  idx = (idx + 1) % PAINEIS.length;
  const prox = mostrando === 'fa' ? 'fb' : 'fa';
  const el = document.getElementById(prox);
  let trocou = false;
  el.onload = () => { if (!trocou) { trocou = true; mostrar(el, prox); } };
  el.src = PAINEIS[idx] + (PAINEIS[idx].includes('?') ? '&' : '?') + 'cb=' + Date.now();
  // fallback: se o onload não vier em 8s, mostra assim mesmo (evita ficar preso)
  setTimeout(() => { if (!trocou) { trocou = true; mostrar(el, prox); } }, 8000);
}
tmr = setTimeout(trocar, TEMPO_MS);
// watchdog: iframe visível vazio (deploy no meio, falha de rede) -> recarrega
setInterval(() => {
  try {
    const f = document.getElementById(mostrando);
    const d = f.contentDocument;
    if (!d || !d.body || d.body.children.length === 0) { f.src = f.src; }
  } catch (e) { /* cross-origin improvável (mesmo host); ignora */ }
}, 12000);
// keepalive: wake lock + reload periódico (mesmas 3 camadas dos painéis)
(async function(){ if(!('wakeLock' in navigator))return; const req=async()=>{try{await navigator.wakeLock.request('screen');}catch(e){}};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')req();}); req(); })();
(function(){const v=document.querySelector('.keepalive');if(!v)return;const p=()=>{const x=v.play();if(x&&x.catch)x.catch(()=>{});};
  v.addEventListener('pause',p);v.addEventListener('ended',p);p();setInterval(()=>{if(v.paused)p();},30000);})();
setTimeout(()=>location.reload(), 30*60*1000);
</script>
</body>
</html>
