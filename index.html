<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silva Pimenta — Painéis Jurídico (TV)</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#0F2F3B;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .6s ease;pointer-events:none}
  iframe.on{opacity:1;pointer-events:auto}
  .keepalive{position:fixed;right:0;bottom:0;width:4px;height:4px;opacity:.01;pointer-events:none;z-index:10000}
</style>
</head>
<body>
<video class="keepalive" src="keepalive.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
<!-- ROTADOR DA TV v3 (25/08/2026, William): ordem FIXA e tempo IGUAL.
     1) iniciais do MÊS  2) encerramentos do MÊS  3) iniciais META (trimestre). 10s cravados em cada.
     Os 3 painéis ficam carregados o tempo todo (cada um atualiza os dados sozinho a cada 30s);
     o rotador só alterna a visibilidade, então a troca é instantânea e o tempo não depende de carregamento. -->
<iframe id="p0" src="mes/index.html?tv=1" title="Iniciais do mês"></iframe>
<iframe id="p1" src="https://silvapimentadireitomedico-cpu.github.io/dashboard-encerramentos-silva-pimenta/?tv=1" title="Encerramentos do mês"></iframe>
<iframe id="p2" src="trimestre.html?tv=1" title="Iniciais meta (trimestre)"></iframe>
<script>
const ORDEM = ['p0', 'p1', 'p2'];   // mês → encerramentos → trimestre
const TEMPO_MS = 10000;             // 10s exatos por painel
let idx = 0, comecou = false;

// Avisa cada painel se está visível (a cobrança das 17:00 só fala no painel que está na tela).
function avisar() {
  ORDEM.forEach((id, i) => {
    try { document.getElementById(id).contentWindow.postMessage({ tv: i === idx ? 'visible' : 'hidden' }, '*'); } catch (e) {}
  });
}
function mostrar(i) {
  idx = i;
  ORDEM.forEach((id, k) => document.getElementById(id).classList.toggle('on', k === i));
  avisar();
}
function girar() { mostrar((idx + 1) % ORDEM.length); setTimeout(girar, TEMPO_MS); }
function comecar() { if (comecou) return; comecou = true; mostrar(0); setTimeout(girar, TEMPO_MS); }
document.getElementById('p0').addEventListener('load', comecar);
setTimeout(comecar, 4000); // se o 1º demorar, começa assim mesmo

// watchdog: painel da mesma origem que ficou vazio (deploy no meio, rede) → recarrega só ele
setInterval(() => {
  ORDEM.forEach(id => {
    const f = document.getElementById(id);
    try { const d = f.contentDocument; if (d && d.readyState === 'complete' && d.body && d.body.children.length === 0) f.src = f.src; } catch (e) { /* cross-origin: ignora */ }
  });
}, 15000);

// keepalive: wake lock + vídeo mudo + reload a cada 30 min (mesmas 3 camadas de antes)
(async function(){ if(!('wakeLock' in navigator))return; const req=async()=>{try{await navigator.wakeLock.request('screen');}catch(e){}};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')req();}); req(); })();
(function(){const v=document.querySelector('.keepalive');if(!v)return;const p=()=>{const x=v.play();if(x&&x.catch)x.catch(()=>{});};
  v.addEventListener('pause',p);v.addEventListener('ended',p);p();setInterval(()=>{if(v.paused)p();},30000);})();
setTimeout(()=>location.reload(), 30*60*1000);
</script>
</body>
</html>
